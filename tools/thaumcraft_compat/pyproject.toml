[project]
name = "thaumcompat"
version = "0.1.0"
description = "Generates Feastcraft's Thaumcraft compatibility datapack"
requires-python = ">=3.11"
dependencies = ["packexport"]

[tool.uv.sources]
packexport = { path = "../pack_export", editable = true }

[tool.mypy]
strict = true
mypy_path = "../pack_export"
