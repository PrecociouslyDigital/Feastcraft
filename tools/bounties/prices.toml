# What items are worth, in Bountiful's worth units. Wheat is about 30.
#
# A raw item is worth its own entry in [items], or else the first raw group that has it. It keeps
# that value even when some recipe makes it, since hay bales make wheat and Theurgy makes raw iron.
# A crafted item is worth what its cheapest recipe's ingredients cost, times markup, plus
# step_bonus. Anything else has no price and is left out of the market.

markup = 1.6
step_bonus = 5
cap = 100000

ignored_recipe_types = [
    # Swap one alchemical sulfur for another.
    "theurgy:reformation",
    # Turn sulfur, salt and mercury back into the thing the sulfur came from.
    "theurgy:incubation",
    # Pour fluid, which the export doesn't list, into a cast or container that isn't used up.
    "tconstruct:casting_table", "tconstruct:casting_basin", "tconstruct:table_casting_material",
    "tconstruct:basin_casting_material", "create:filling", "create:emptying",
    # Wash items for outputs that only come by chance, which the export lists as certain.
    "create:splashing",
]

# Cookbook of Babel's stand-ins, which become any of hundreds of things through NBT.
unpriced = ["cookbook_of_babel:portion", "cookbook_of_babel:substance"]

# Utensils a recipe gives back, such as Pam's bakeware, so they cost nothing.
[free]
tags = [
    "forge:tool_bakeware", "forge:tool_cuttingboard", "forge:tool_grinder", "forge:tool_juicer", "forge:tool_mixingbowl",
    "forge:tool_pot", "forge:tool_roller", "forge:tool_saucepan", "forge:tool_skillet", "forge:mortar_and_pestles",
]
ids = ["croptopia:knife", "croptopia:frying_pan", "croptopia:cooking_pot", "croptopia:mortar_and_pestle", "croptopia:food_press", "croptopia:roller"]

# Selectors take tags, namespaces, ids (globs) and deny (globs, or #tags). The tag loot:entities
