# The smithy's ledger: what happens to every plain tool, weapon and armor piece in the pack.
# Every item the export tags as a tool, weapon or armor and is not from a Tinkers mod is here,
# either as a conversion or as a keep. Run `uv run python -m smithy` to regenerate the
# datapack; it fails if a tagged item is missing from this file.

