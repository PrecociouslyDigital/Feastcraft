// The one build convention every Feastcraft mod applies. A mod's own build.gradle only applies
// this plugin; its identity (mod_id, mod_name, ...) lives in that mod's gradle.properties.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
}

// Every pack mod gets a `harness` run: a client that also loads the harness mod, which lets an agent
// play it headlessly (see tools/harness). The harness is itself built with this plugin.
def harnessPath = ':tools:harness'
def harnessProject = project.path == harnessPath ? null : project(harnessPath)
if (harnessProject != null) {
    evaluationDependsOn(harnessPath)
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

// 1.20.1 ships Java 17 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        if (harnessProject != null) {
            "${harnessProject.mod_id}" {
                sourceSet harnessProject.sourceSets.main
            }
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        if (harnessProject != null) {
            harness {
                client()
                gameDirectory = file('run-harness')
                systemProperty 'feastcraft.harness.port', '25580'
                // Where the caller will find run-harness, which differs from this path inside a container.
                systemProperty 'feastcraft.harness.hostGameDir',
                        providers.environmentVariable('HARNESS_HOST_GAME_DIR').getOrElse(file('run-harness').absolutePath)
                programArguments.addAll '--width', '1280', '--height', '720', '--username', 'Harness'
            }
        }
        configureEach {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
            loadedMods = name == 'harness'
                    ? [mods[mod_id], mods[harnessProject.mod_id]]
                    : [mods[mod_id]]
        }
    }
}

if (harnessProject != null) {
    def copyHarnessTemplate = tasks.register('copyHarnessTemplate', Copy) {
        from harnessProject.file('run-template')
        into file('run-harness')
    }
    legacyForge.runs.harness.taskBefore copyHarnessTemplate

    // Mojang's 1.20.1 manifest has no linux-arm64 natives, which an arm64 container (Docker on Apple
    // silicon) needs. 3.3.1 is the LWJGL version Minecraft 1.20.1 pins.
    if (System.getProperty('os.name') == 'Linux' && System.getProperty('os.arch') == 'aarch64') {
        // Gradle fetches a module's files only from the repository that had its metadata, and
        // Mojang's library repository has LWJGL without these natives.
        repositories {
            exclusiveContent {
                forRepository { mavenCentral() }
                filter { includeGroup 'org.lwjgl' }
            }
        }
        def nativesConfiguration = legacyForge.runs.harness.additionalRuntimeClasspathConfiguration.name
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-jemalloc', 'lwjgl-tinyfd'].each {
            dependencies.add(nativesConfiguration, "org.lwjgl:${it}:3.3.1:natives-linux-arm64")
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

def mixinConfig = "${mod_id}.mixins.json"
if (file("src/main/resources/${mixinConfig}").exists()) {
    mixin {
        add sourceSets.main, "${mod_id}.refmap.json"
        config mixinConfig
    }
    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
    jar {
        manifest.attributes('MixinConfigs': mixinConfig)
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('build-logic/templates')
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

repositories {
    mavenCentral()
    // Other mods we build against: maven.modrinth:<slug>:<version id> from Modrinth, and
    // curse.maven:<slug>-<project id>:<file id> for mods only on CurseForge.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.jqwik:jqwik:1.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
